server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Render backend
    location /api/ {
        proxy_pass https://paris-parking-analysis-1.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Host paris-parking-analysis-1.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        # Required for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
